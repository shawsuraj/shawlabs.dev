<div class="explorer" data-explorer>
  <label for="headline">Type a headline, or pick one</label>
  <div class="field"><input id="headline" type="text" value="Drone strike kills 3 in Kharkiv" autocomplete="off" spellcheck="false"></div>
  <div class="examples">
    <button type="button">Drone strike kills 3 in Kharkiv</button>
    <button type="button">Riot police clash with protesters, 1,800 arrested, looting overnight</button>
    <button type="button">Minister blasts rival's claims about border</button>
    <button type="button">Capital braces for protests ahead of election</button>
    <button type="button">Army declares curfew after coup attempt</button>
  </div>
  <div class="readout">
    <div>
      <p class="marked" aria-live="polite"></p>
      <ul class="terms"></ul>
    </div>
    <div class="gauge">
      <div class="n">0.00</div>
      <div class="lbl">harm signal for this one article</div>
      <div class="scale"><b></b></div>
      <div class="ends"><span>0 noise</span><span>1 catastrophe</span></div>
      <p></p>
    </div>
  </div>
  <p class="fine">A simplified, in-browser version of the real rules, using the real constants from v3.2.0. The live model reads far more patterns, checks where the event happened and how widely it was reported, then works across days and weeks.</p>
</div>
